{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

 <div class="nav-scroller py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
          {% for i in categories %}
          <a class="p-2 text-muted" href="/category/{{ i.id }}/">{{i.category_name}}</a>
          {% endfor %}
        </nav>
      </div>

<div class="row">

    {% include "dashboard/slider.html" %}

    <!-- Right side content -->
    <div class="col-md-9">
        <h2>Add Categories</h2>
        <form action="{% url "edit_posts" post.id %}" method="POST" enctype="multipart/form-data" > 
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
        <br> 
    </div>
</div>

{% endblock %}
