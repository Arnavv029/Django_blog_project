{% extends 'base.html' %}

{% block content %}

 <div class="nav-scroller py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
          {% for i in categories %}
          <a class="p-2 text-muted" href="/category/{{ i.id }}/">{{i.category_name}}</a>
          {% endfor %}
        </nav>
      </div>

<div class="row">
    
    <div class="col-md-3">
        <div class="nav flex-column nav-pills bg-light" aria-orientation="vertical"> 
            <a href="" class="nav-link text-dark bg-warning">Dashboared</a>
            <a href="" class="nav-link text-dark">Categories</a>
            <a href="" class="nav-link text-dark">Blogs</a>
            <a href="" class="nav-link text-dark">Logout</a>
        </div>
    </div>

    <!-- Right side content -->
    <div class="col-md-9">
        <!-- <span>Logged in as <b>{{ user }}</b></span> -->
        <div class="row">
            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All Categories</div>
                    <div class="card-body text-dark">
                        <h5 class="card-title text-center">{{categories_count}}</h5>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All posts</div>
                    <div class="card-body text-dark">
                        <h5 class="card-title text-center">{{blogs_count}}</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
